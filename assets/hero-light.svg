<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="460" viewBox="0 0 1600 460" role="img" aria-labelledby="t d">
<title id="t">Valentin Preutesei — Full Stack Developer</title>
<desc id="d">Python, TypeScript and AWS. Payments, SaaS and live sports results in production for RFEA, FETRI and ECF.</desc>
<style>
  .f{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif}
  .m{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace}
  .up{opacity:0;animation:up .8s cubic-bezier(.2,.7,.2,1) forwards}
  @keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .blink{animation:blink 1.6s ease-in-out infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
  @media (prefers-reduced-motion: reduce){.up{animation:none;opacity:1}.blink{animation:none}}
</style>
<rect x=".5" y=".5" width="1599" height="459" rx="20" fill="#ffffff" stroke="#e3e6ec"/>

<defs>
  <pattern id="g" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#eef0f4" stroke-width="1"/></pattern>
  <linearGradient id="fx" x1="0" x2="1"><stop offset=".38" stop-color="#ffffff"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
  <radialGradient id="glow"><stop offset="0" stop-color="#2563eb" stop-opacity=".22"/><stop offset="1" stop-color="#2563eb" stop-opacity="0"/></radialGradient>
  <clipPath id="c"><rect x="1" y="1" width="1598" height="458" rx="19"/></clipPath>
</defs>
<g clip-path="url(#c)">
  <rect width="1600" height="460" fill="url(#g)"/>
  <rect width="1600" height="460" fill="url(#fx)"/>
  <circle cx="1250" cy="230" r="230" fill="url(#glow)"/>
  <g transform="rotate(-16 1250 230)">
    <path d="M1000,230 a250,92 0 1,0 500,0 a250,92 0 1,0 -500,0" fill="none" stroke="#c9d4e8" stroke-width="2"/>
    <path d="M1100,230 a150,55 0 1,0 300,0 a150,55 0 1,0 -300,0" fill="none" stroke="#c9d4e8" stroke-width="1.5" stroke-dasharray="4 7"/>
    <circle r="7" fill="#2563eb"><animateMotion dur="14s" repeatCount="indefinite" path="M1000,230 a250,92 0 1,0 500,0 a250,92 0 1,0 -500,0"/></circle>
    <circle r="4.5" fill="#2563eb" opacity=".55"><animateMotion dur="7s" repeatCount="indefinite" path="M1100,230 a150,55 0 1,0 300,0 a150,55 0 1,0 -300,0" begin="-2s"/></circle>
  </g>
  <circle cx="1250" cy="230" r="34" fill="#0a0f1c"/>
  <circle cx="1239" cy="218" r="10" fill="#ffffff" opacity=".08"/>
</g>
<g class="f">
  <g class="up" style="animation-delay:0s">
    <circle cx="94" cy="92" r="6" fill="#16a34a" class="blink"/>
    <text x="112" y="99" font-size="21" fill="#5b6575" class="m">in production · RFEA · FETRI · ECF</text>
  </g>
  <text x="84" y="214" font-size="92" font-weight="700" letter-spacing="-3.5" fill="#0a0f1c" class="up" style="animation-delay:0.1s">Valentin Preutesei</text>
  <text x="88" y="276" font-size="38" font-weight="500" fill="#2b3443" class="up" style="animation-delay:0.2s">Full Stack Developer <tspan fill="#2563eb">/</tspan> Python, TypeScript, AWS</text>
  <text x="88" y="340" font-size="25" fill="#5b6575" class="up" style="animation-delay:0.3s">Payments, SaaS and live sports results that real people use.</text>
  <g class="up" style="animation-delay:0.4s">
    <rect x="88" y="374" width="262" height="40" rx="20" fill="rgba(37,99,235,0.08)" stroke="#2563eb" stroke-opacity=".35"/>
    <text x="219" y="400" font-size="19" font-weight="600" fill="#1d4ed8" text-anchor="middle">valentinpreutesei.com  →</text>
  </g>
