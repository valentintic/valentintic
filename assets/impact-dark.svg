<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="250" viewBox="0 0 1600 250" role="img" aria-labelledby="t d">
<title id="t">Impact in numbers</title>
<desc id="d">API from 2 s to 300 ms; over 500,000 euros processed in under a year; 99.99% uptime over 12 months; 160,000+ licences and registrations.</desc>
<style>
  .f{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif}
  .m{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace}
  .up{opacity:0;animation:up .8s cubic-bezier(.2,.7,.2,1) forwards}
  @keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .blink{animation:blink 1.6s ease-in-out infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
  @media (prefers-reduced-motion: reduce){.up{animation:none;opacity:1}.blink{animation:none}}
</style>
<rect x=".5" y=".5" width="1599" height="249" rx="20" fill="#111316" stroke="#262a31"/>
<g class="f"><g class="up" style="animation-delay:0.0s">
  <rect x="24.0" y="24" width="373.0" height="202" rx="14" fill="#0c0e10" stroke="#262a31"/>
  <rect x="52.0" y="54" width="26" height="4" rx="2" fill="#4d8dff"/>
  <text x="52.0" y="124" font-size="50" font-weight="700" letter-spacing="-1.8" fill="#f2f4f7">2 s → 300 ms</text>
  <text x="52.0" y="166" font-size="21" fill="#a6adb8">API response time</text>
  <text x="52.0" y="200" font-size="16" fill="#7d8590" class="m">AllUPay · DynamoDB BatchGetItem</text>
</g>
<g class="up" style="animation-delay:0.08s">
  <rect x="417.0" y="24" width="373.0" height="202" rx="14" fill="#0c0e10" stroke="#262a31"/>
  <rect x="445.0" y="54" width="26" height="4" rx="2" fill="#4d8dff"/>
  <text x="445.0" y="124" font-size="50" font-weight="700" letter-spacing="-1.8" fill="#f2f4f7">€500k+</text>
  <text x="445.0" y="166" font-size="21" fill="#a6adb8">processed in under a year</text>
  <text x="445.0" y="200" font-size="16" fill="#7d8590" class="m">Conersys · licences platform</text>
</g>
<g class="up" style="animation-delay:0.16s">
  <rect x="810.0" y="24" width="373.0" height="202" rx="14" fill="#0c0e10" stroke="#262a31"/>
  <rect x="838.0" y="54" width="26" height="4" rx="2" fill="#4d8dff"/>
  <text x="838.0" y="124" font-size="50" font-weight="700" letter-spacing="-1.8" fill="#f2f4f7">99.99 %</text>
  <text x="838.0" y="166" font-size="21" fill="#a6adb8">uptime over 12 months</text>
  <text x="838.0" y="200" font-size="16" fill="#7d8590" class="m">Conersys · payments platform</text>
</g>
<g class="up" style="animation-delay:0.24s">
  <rect x="1203.0" y="24" width="373.0" height="202" rx="14" fill="#0c0e10" stroke="#262a31"/>
  <rect x="1231.0" y="54" width="26" height="4" rx="2" fill="#4d8dff"/>
  <text x="1231.0" y="124" font-size="50" font-weight="700" letter-spacing="-1.8" fill="#f2f4f7">160k+</text>
  <text x="1231.0" y="166" font-size="21" fill="#a6adb8">licences and registrations</text>
  <text x="1231.0" y="200" font-size="16" fill="#7d8590" class="m">Conersys · federations</text>
</g></g>
</svg>
