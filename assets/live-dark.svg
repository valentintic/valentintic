  <rect x="365.5" y="112" width="250" height="104" rx="14" fill="#0c0e10" stroke="#262a31" stroke-opacity="1"/>
  <text x="490.5" y="158" font-size="22" font-weight="600" fill="#f2f4f7" text-anchor="middle">Wired venue network</text>
  <text x="490.5" y="188" font-size="16" fill="#7d8590" text-anchor="middle" class="m">our own cabling</text>
</g>
<g class="up" style="animation-delay:0.16s">
