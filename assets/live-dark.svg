  <text x="800.0" y="188" font-size="16" fill="#7d8590" text-anchor="middle" class="m">ASP.NET Core · Redis</text>
</g>
<g class="up" style="animation-delay:0.24s">
  <rect x="984.5" y="112" width="250" height="104" rx="14" fill="rgba(77,141,255,0.10)" stroke="#4d8dff" stroke-opacity=".5"/>
  <text x="1109.5" y="158" font-size="22" font-weight="600" fill="#f2f4f7" text-anchor="middle">SignalR hub</text>
  <text x="1109.5" y="188" font-size="16" fill="#7d8590" text-anchor="middle" class="m">push, no polling</text>
</g>
<g class="up" style="animation-delay:0.32s">
