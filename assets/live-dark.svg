<circle r="4" fill="#4d8dff"><animateMotion dur="2.4s" begin="1.05s" repeatCount="indefinite" path="M1234.5 164.0H1294.0"/></circle>
<circle r="4" fill="#4d8dff"><animateMotion dur="2.4s" begin="2.25s" repeatCount="indefinite" path="M1234.5 164.0H1294.0"/></circle>
<g class="up" style="animation-delay:0.0s">
  <rect x="56.0" y="112" width="250" height="104" rx="14" fill="#0c0e10" stroke="#262a31" stroke-opacity="1"/>
  <text x="181.0" y="158" font-size="22" font-weight="600" fill="#f2f4f7" text-anchor="middle">Field &amp; timing</text>
  <text x="181.0" y="188" font-size="16" fill="#7d8590" text-anchor="middle" class="m">marks and times</text>
</g>
