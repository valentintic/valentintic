<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="330" viewBox="0 0 1600 330" role="img" aria-labelledby="t d">
<title id="t">Live results architecture</title>
<desc id="d">Field and timing, wired venue network, results API with Redis, SignalR hub, web and TV graphics.</desc>
<style>
  .f{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif}
  .m{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace}
  .up{opacity:0;animation:up .8s cubic-bezier(.2,.7,.2,1) forwards}
  @keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .blink{animation:blink 1.6s ease-in-out infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
  @media (prefers-reduced-motion: reduce){.up{animation:none;opacity:1}.blink{animation:none}}
</style>
<rect x=".5" y=".5" width="1599" height="329" rx="20" fill="#111316" stroke="#262a31"/>
<g class="f"><text x="56" y="62" font-size="15" letter-spacing="2" fill="#7d8590" class="m">LIVE RESULTS · HOW A MARK REACHES THE SCREEN</text>
