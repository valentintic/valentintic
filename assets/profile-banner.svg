<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="400" viewBox="0 0 1600 400" role="img" aria-labelledby="title description">
  <title id="title">Valentin Preutesei — Full Stack Developer</title>
  <desc id="description">Python, TypeScript and Next.js on AWS. Payments, SaaS and live sports results in production.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#e6e9ef" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.45" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="400" rx="24" fill="#ffffff"/>
  <rect x="1" y="1" width="1598" height="398" rx="23" fill="url(#grid)"/>
  <rect x="1" y="1" width="1598" height="398" rx="23" fill="url(#fade)"/>
  <rect x="0.5" y="0.5" width="1599" height="399" rx="23.5" fill="none" stroke="#dfe3ea"/>
  <g font-family="'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
    <circle cx="96" cy="96" r="8" fill="#2563eb"/>
    <text x="118" y="104" font-size="24" font-weight="500" fill="#556070" letter-spacing="0.5">valentinpreutesei.com</text>
    <text x="84" y="208" font-size="84" font-weight="700" letter-spacing="-3" fill="#0a0f1c">Valentin Preutesei</text>
    <text x="88" y="268" font-size="38" font-weight="500" fill="#2b3443">Full Stack Developer <tspan fill="#2563eb">·</tspan> Python, TypeScript, AWS</text>
    <text x="88" y="330" font-size="26" fill="#556070">Payments, SaaS and live sports results, in production.</text>
  </g>
  <g transform="translate(1290 200)">
    <ellipse rx="190" ry="70" fill="none" stroke="#c7d3ea" stroke-width="2" transform="rotate(-18)"/>
    <ellipse rx="120" ry="44" fill="none" stroke="#dbe3f2" stroke-width="2" transform="rotate(-18)"/>
    <circle r="26" fill="#0a0f1c"/>
    <circle cx="-158" cy="-14" r="9" fill="#2563eb"/>
    <circle cx="104" cy="-56" r="6" fill="#2563eb" opacity="0.55"/>
